<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>내 트리를 꾸며줘!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a1622'/><path d='M16 6.5 11 16h10z' fill='%232b7152'/><path d='M16 12 9 24h14z' fill='%231b4e3b'/><rect x='14.6' y='23' width='2.8' height='4' rx='1' fill='%235b4029'/><circle cx='16' cy='5' r='2.6' fill='%23f0c457'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="xmas.css">
  <style>
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden }

    /* ── 전시 화면은 트리에 자리를 다 내준다 ──────────────────────
       예전에는 제목과 아래 문구가 트리 위아래를 차지해 큰 TV에서도 트리가
       화면 한가운데 작게 떴다. 지금은 트리가 화면 높이를 꽉 채우고
       글자는 빈 밤하늘 위에 겹쳐 둔다.
       트리 칸은 여전히 폭 하나만 정한다 — aspect-ratio가 높이를 폭에서
       끌어내므로 둘 다 적으면 어긋나고, 그러면 오너먼트 좌표가 틀어진다. */
    .xm-treestage {
      position: fixed; inset: 0; z-index: 2;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    /* 카메라. 가까이 보기에서 이 칸을 통째로 확대하고 위아래로 훑는다. */
    .xm-cam {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transform-origin: 50% 0;
      will-change: transform;
    }
    .xm-treestage .xm-treewrap {
      width: min(100%, 100dvh * 100 / 140);
      margin: 0;
      container-type: inline-size;   /* 라벨 글자 크기를 트리 폭에 맞추려고 */
    }

    /* 글자는 트리 위에 겹친다. 가로로 넓은 화면(트리가 높이에 막히는 화면)에서는
       트리 양옆이 비므로 구석으로, 세로로 긴 화면에서는 트리 위아래가 비므로
       가운데로 둔다. 경계는 트리 비율(100/140) 그대로다. */
    .xm-treehead, .xm-treefoot {
      position: fixed; z-index: 4;
      text-shadow: 0 2px 10px rgba(5, 12, 22, .85);
      pointer-events: none;
    }
    .xm-treehead { top: 20px; left: 0; right: 0; text-align: center }
    .xm-treetitle { font-size: 26px; font-weight: 800; letter-spacing: -.6px; margin: 0 0 4px }
    .xm-treesub   { color: var(--hi-text-muted); font-size: 14px; margin: 0 }

    /* 학생 입장 QR(img/qr-index.svg, tools/make-qr.mjs가 만든다).
       흰 여백은 그림 안에 들어 있어 밤하늘 위에 그대로 올려도 읽힌다. */
    .xm-treeqr {
      display: block; margin: 12px auto 0;
      width: clamp(130px, 15vmin, 230px); height: auto;
      border-radius: 8px; box-shadow: 0 4px 14px rgba(5, 12, 22, .5);
    }
    .xm-treefoot {
      bottom: 20px; left: 0; right: 0; text-align: center;
      color: var(--hi-text-muted); font-size: 15px; letter-spacing: -.2px;
    }
    .xm-treefoot b { color: var(--hi-accent); font-size: 21px; font-weight: 800 }

    @media (min-aspect-ratio: 100/140) {
      .xm-treehead  { top: 22px; left: 26px; right: auto; text-align: left }
      .xm-treefoot { bottom: 24px; left: 26px; right: auto; text-align: left }
      .xm-treeqr   { margin-left: 0 }
    }

    /* 선생님 모드 알림 띠 */
    .xm-minebar {
      display: none;
      position: fixed; z-index: 5; left: 50%; top: 14px; transform: translateX(-50%);
      align-items: center; gap: 12px; flex-wrap: wrap;
      background: rgba(10, 22, 34, .82);
      border: 1px solid var(--hi-border-faint);
      border-radius: 999px; padding: 10px 18px;
      font-size: 14px; font-weight: 700; color: var(--hi-accent);
      max-width: max-content;
    }
    .xm-minebar.on { display: flex }

    /* 구석 단추 */
    .xm-corner {
      position: fixed; right: 16px; bottom: 16px; z-index: 6;
      display: flex; gap: 8px; align-items: center;
      opacity: .45; transition: opacity .2s ease;
    }
    .xm-corner:hover, .xm-corner:focus-within { opacity: 1 }

    @media (max-width: 600px) {
      .xm-corner { right: 10px; bottom: 10px }
      .xm-treetitle { font-size: 21px }
      .xm-treefoot { bottom: 58px }
      .xm-treeqr { display: none }   /* 폰으로 트리를 볼 때는 QR이 필요 없다 */
    }

    /* ── 꼭대기 별 ───────────────────────────────────────────────
       별 전체를 켰다 껐다 하면 전구가 되고, 빛 한 줄기가 훑고 지나가면 금속판이 된다.
       **샹들리에는 그렇게 안 반짝인다** — 작은 크리스털 여러 개가 **저마다 다른 때에
       아주 짧게** 번쩍인다. 그래서 별 위에 작은 섬광 아홉 개를 흩어 두고, 하나하나
       길이도 시작도 다르게 줬다. 한 번 번쩍이는 데 0.2초쯤이고 나머지 시간은 꺼져 있다.
       뒤에 깔린 둘레 빛만 천천히 숨 쉰다.

       SVG 안에서 transform을 쓸 때는 **transform-box: fill-box를 꼭 같이 적는다.**
       안 적으면 SVG 전체 좌표를 기준으로 커져 별이 화면 밖으로 날아간다. */
    #starGlow, .xm-spark { transform-box: fill-box; transform-origin: center }

    #starGlow { animation: xm-starglow 3.6s ease-in-out infinite alternate }
    @keyframes xm-starglow {
      from { opacity: .76; transform: scale(.95) }
      to   { opacity: 1;   transform: scale(1.06) }
    }

    /* 꺼져 있는 시간이 길어야 "번쩍"으로 읽힌다. 켜져 있는 구간은 전체의 15%쯤이다. */
    .xm-spark { opacity: 0; animation: xm-spark var(--sp, 1.4s) ease-out infinite }
    @keyframes xm-spark {
      0%, 64% { opacity: 0; transform: scale(.25) }
      73%     { opacity: 1; transform: scale(1) }
      87%     { opacity: 0; transform: scale(.55) }
      100%    { opacity: 0; transform: scale(.25) }
    }

    /* 별과 트리의 반짝임(.xm-glint)은 xmas.css에 있다 — 두 군데가 같이 쓴다. */

    /* 가지의 전구 줄. 알을 세 무리로 나눠 박자를 어긋나게 숨 쉬게 한다.
       한꺼번에 밝아지면 전등 스위치를 켠 것처럼 보인다. 꺼지지는 않고 은은하게만 오르내린다.
       무리째(g 세 개) opacity만 바꾸므로 값이 거의 들지 않는다. */
    .xt-l0, .xt-l1, .xt-l2 { animation: xt-bulb 3.2s ease-in-out infinite alternate }
    .xt-l1 { animation-duration: 2.6s; animation-delay: -1.1s }
    .xt-l2 { animation-duration: 3.8s; animation-delay: -2.3s }
    @keyframes xt-bulb { from { opacity: .55 } to { opacity: 1 } }

    /* 트리가 아직 비었을 때 */
    .xm-treeempty {
      position: absolute; left: 0; right: 0; top: 46%;
      text-align: center; font-size: 15px; color: var(--hi-text-muted);
      line-height: 1.8; pointer-events: none;
    }

    /* ── 가까이 보기 ──────────────────────────────────────────────
       카메라를 확대해 꼭대기부터 밑동까지 천천히 훑어 내렸다가 다시 올라온다.
       transform은 오른쪽부터 먹으므로 scale(Z) translateY(p)에서 실제로 움직인
       거리는 Z배가 된다. 어디서 시작해 어디서 멈출지(--pan0, --pan1)는 화면과
       트리의 실제 높이를 보고 스크립트가 px로 셈해 넣는다 — 화면 비율이 제각각이라
       한 가지 비율로 묶어 두면 세로로 긴 화면에서 트리를 지나쳐 허공을 훑는다.

       **움직임 줄이기(prefers-reduced-motion)로 이 애니메이션을 끄지 않는다.**
       가까이 보기는 사람이 일부러 고르는 보기이고, 훑어 내려가는 것이 그 보기의
       전부다. 끄면 화면이 확대된 채 멈춰 고장난 것처럼 보인다.
       (오너먼트 흔들림이나 별 반짝임 같은 곁다리는 그대로 끈다.) */
    .xm-cam.zoom {
      animation: xm-pan var(--pan-sec, 24s) ease-in-out infinite alternate;
    }
    @keyframes xm-pan {
      from { transform: scale(var(--zoom)) translateY(var(--pan0)) }
      to   { transform: scale(var(--zoom)) translateY(var(--pan1)) }
    }
    /* 학번과 이름. 평소에는 없고 가까이 보기에서만, 오너먼트 바로 위에 겹쳐 뜬다.
       글자 크기를 cqw(트리 폭의 %)로 두어야 화면이 커져도 오너먼트와 같은
       비율을 지킨다. px로 두면 큰 TV에서 깨알같이 작아진다.

       한꺼번에 다 띄우면 160장이 서로 겹쳐 글자 덩어리가 된다. 그래서
       카메라가 지금 보고 있는 띠에서만 켜고, 켜고 끄는 것은 .on 한 가지로만 한다.
       **밝기를 거리에 따라 매 프레임 조금씩 바꾸면 깜빡이는 것처럼 보인다** —
       켜고 끄기만 하고 사이는 transition이 알아서 천천히 건너가게 둔다. */
    .xm-lab {
      display: none;
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap; text-align: center;
      font-size: .95cqw; line-height: 1.2; font-weight: 700;
      color: #fff;
      opacity: 0;
      transition: opacity .75s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .95), 0 0 8px rgba(0, 0, 0, .85);
      pointer-events: none;
    }
    .xm-lab i { display: block; font-style: normal; opacity: .85; font-weight: 600 }
    .xm-orns.labels .xm-lab { display: block }
    .xm-orns.labels .xm-hang.lab-on .xm-lab { opacity: .72 }

    /* ── 편지 한 통 열어 보기 ────────────────────────────────────
       <dialog>를 쓰면 가운데 놓기, 뒤 가리기, Esc로 닫기를 브라우저가 해 준다. */
    .xm-lmodal {
      border: 0; padding: 0; background: none; color: inherit;
      width: min(92vw, 520px); max-width: none;
      -webkit-user-select: text; user-select: text;   /* body에서 글자 고르기를 막아 두었다 */
    }
    .xm-lmodal::backdrop { background: rgba(5, 12, 22, .74); backdrop-filter: blur(3px) }
    .xm-lmodal .xm-letter { max-height: 70dvh; overflow-y: auto }
    .xm-lmodal .xm-actions { margin-top: 14px }
    /* 선생님이 자기 편지만 보고 있을 때는 학생 입장 QR이 필요 없다 */
    body.mineonly .xm-treeqr { display: none }


  </style>
</head>
<body class="hi-preset-xmas xm-body">
  <div class="xm-sky"></div>
  <div class="xm-stars"></div>
  <div class="xm-campus"></div>
  <canvas class="xm-snow" id="snow"></canvas>

  <main class="xm-treestage">
    <div class="xm-cam" id="cam">
      <div class="xm-treewrap" id="wrap">
        <!-- 가지와 별은 tree-layout.js의 TIERS에서 그린다(자리 계산과 같은 파일이라 어긋나지 않는다) -->
        <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet" aria-label="크리스마스트리">
          <g id="treeArt"></g>
        </svg>
        <div class="xm-orns" id="orns"></div>
        <div class="xm-treeempty" id="treeEmpty" hidden>아직 달린 편지가 없어요.<br>첫 번째 마음을 달아 주세요.</div>
      </div>
    </div>
  </main>

  <header class="xm-treehead">
    <h1 class="xm-treetitle" id="title">내 트리를 꾸며줘!</h1>
    <p class="xm-treesub" id="sub">마음을 적어 트리에 달아 주세요</p>
    <img class="xm-treeqr" src="img/qr-index.svg" alt="학생 작성 화면 QR 코드" width="148" height="148">
  </header>

  <div class="xm-treefoot" id="foot"></div>

  <div class="xm-minebar" id="minebar">
    <span id="mineLabel"></span>
    <button class="xm-btn xm-btn-ghost xm-btn-sm" id="mineToggle" type="button">트리 전체 보기</button>
    <a class="xm-btn xm-btn-ghost xm-btn-sm" href="teacher.html">편지 모아보기</a>
    <button class="xm-btn xm-btn-ghost xm-btn-sm" id="mineOut" type="button">나가기</button>
  </div>

  <dialog class="xm-lmodal" id="letterModal">
    <div class="xm-letter" id="letterCard"></div>
    <div class="xm-actions">
      <button class="xm-btn xm-btn-ghost" id="letterClose" type="button">닫기</button>
    </div>
  </dialog>

  <div class="xm-corner">
    <button class="xm-btn xm-btn-ghost xm-btn-sm" id="nextTree" type="button" hidden>다음 트리</button>
    <button class="xm-btn xm-btn-ghost xm-btn-sm" id="viewBtn" type="button">가까이 보기</button>
    <a class="xm-btn xm-btn-ghost xm-btn-sm" href="teacher.html">선생님 전용</a>
  </div>

<script type="module">
import { collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, C_ORNAMENTS, watchConfig, esc, nl2br, studentIdLabel, fmtDateTime, mountSnow }
  from "./xmas-core.js";
import { ornamentSVG } from "./ornaments.js";
import { placeAll, pageCount, TREE_CAP, TREE, starPath, treeArtSVG, rayPath } from "./tree-layout.js";
import { demoCount, demoOrnaments, mountDemoBadge } from "./demo-data.js";

const $ = s => document.querySelector(s);

mountSnow($('#snow'), 160);   // 전시 화면은 넉넉히

/* ── 트리 그리기 ───────────────────────────────────────────────
   가지와 전구 줄은 tree-layout.js의 treeArtSVG()가 그린다(학생 화면의 자리 고르기
   트리와 같은 그림이어야 해서 한 곳에 둔다). 여기서는 꼭대기 별만 더 얹는다. */
(function drawTree() {
  const art = $('#treeArt');
  const ns = 'http://www.w3.org/2000/svg';
  const add = (tag, attrs) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    art.appendChild(el);
    return el;
  };

  // 기본은 수채화(2026-11-24에 고르셨다). `?art=svg` 로 예전 민트 SVG 트리를 띄워 볼 수 있다.
  const look = new URLSearchParams(location.search).get('art') || 'paint';
  art.insertAdjacentHTML('beforeend', treeArtSVG({ paint: look === 'paint' }));

  /* 꼭대기 별.
     바깥에 옅은 별을 한 겹 더 까는 방식은 버렸다 — 어두운 밤하늘 위에서
     낮은 불투명도의 금색이 회색 테두리처럼 보여 빛이 아니라 그림자가 됐다.
     지금은 가운데가 밝고 가장자리로 사라지는 둥근 빛을 뒤에 깐다.
     (오너먼트와 달리 트리는 화면에 하나뿐이라 그라데이션 id를 써도 안 엉킨다.)

     빛이 viewBox 위로 삐져나가면 거기서 뚝 잘려 네모 자국이 생긴다. 그래서 별을
     조금 내리고 빛 반지름을 위쪽 여백 안에 맞췄다(cy - r >= 0). 작은 섬광들도
     같은 까닭으로 별 둘레를 크게 벗어나지 않게 뒀다. */
  const STAR_Y = 11, GLOW_R = 11;
  const defs = document.createElementNS(ns, 'defs');

  const mkGrad = (tag, id, attrs, stops) => {
    const g = document.createElementNS(ns, tag);
    g.setAttribute('id', id);
    for (const k in attrs) g.setAttribute(k, attrs[k]);
    stops.forEach(([off, col, op]) => {
      const s = document.createElementNS(ns, 'stop');
      s.setAttribute('offset', off);
      s.setAttribute('stop-color', col);
      s.setAttribute('stop-opacity', op);
      g.appendChild(s);
    });
    defs.appendChild(g);
  };

  mkGrad('radialGradient', 'xmStarGlow', {},
    [['0%', '#ffe9a8', '.6'], ['45%', '#f0c457', '.24'], ['100%', '#f0c457', '0']]);
  defs.appendChild(document.createComment('샹들리에 섬광에 쓰는 빛'));
  mkGrad('radialGradient', 'xmSparkGlow', {},
    [['0%', '#ffffff', '.95'], ['40%', '#fff3cf', '.35'], ['100%', '#ffe09a', '0']]);
  art.appendChild(defs);

  const glow = add('circle', { id: 'starGlow', cx: 50, cy: STAR_Y, r: GLOW_R, fill: 'url(#xmStarGlow)' });
  if (look === 'paint') {
    // 수채화 시안은 별을 그림 안에 칠해 두었다. 둘레 빛만 그림 뒤로 깔고 섬광은 위에 얹는다.
    art.prepend(glow);
  } else {
    /* 가만히 있을 때는 금색으로 둔다. 거의 흰 별로 뒀더니 섬광이 터져도 더 밝아질
       자리가 없어 아무 일도 안 일어난 것처럼 보였다. */
    add('path', { d: starPath(50, STAR_Y, 8.4, 3.5), fill: '#edc05c' });
    add('path', { d: starPath(50, STAR_Y - 0.5, 4.2, 1.8), fill: '#ffeaae', 'fill-opacity': 0.85 });
  }

  /* ── 샹들리에 섬광 ───────────────────────────────────────────
     꼭지 다섯과 안쪽 네 군데에 작은 네 갈래 빛을 둔다. 길이와 시작을 모두 달리해
     서로 겹치지 않게 번쩍인다. 자리와 길이는 적어 둔 값이라 매번 같다
     (난수로 두면 새로고침할 때마다 다른 데서 번쩍여 어디를 봐야 할지 모르게 된다). */
  const sparkPath = (cx, cy, r, k = 0.17) => {
    const q = r * k;
    return `M${cx} ${cy - r}Q${cx + q} ${cy - q} ${cx + r} ${cy}`
         + `Q${cx + q} ${cy + q} ${cx} ${cy + r}`
         + `Q${cx - q} ${cy + q} ${cx - r} ${cy}`
         + `Q${cx - q} ${cy - q} ${cx} ${cy - r}Z`;
  };

  // [꼭지각(도), 중심에서 떨어진 거리, 크기, 한 바퀴(초), 시작 어긋남(초)]
  const SPARKS = [
    [-90,  8.2, 3.0, 1.30, 0.00],
    [-18,  8.2, 2.6, 1.70, 0.55],
    [ 54,  8.2, 2.8, 1.45, 1.05],
    [126,  8.2, 2.4, 1.90, 0.30],
    [198,  8.2, 2.7, 1.55, 0.85],
    [-54,  3.6, 1.9, 1.15, 0.45],
    [ 18,  3.6, 1.7, 1.35, 0.95],
    [162,  3.6, 2.0, 1.25, 0.15],
    [ 90,  3.2, 1.6, 1.60, 0.70],
  ];
  /* 수채화 시안의 반짝임 (2026-11-24 "별이 이중으로 겹친 도형 같다, 반짝이는 효과도 그렇다").
     단단한 흰 네 갈래 조각이 켜졌다 꺼지면 빛이 아니라 스티커가 붙었다 떨어지는 것 같다.
     참고 그림처럼 둘레 빛(#starGlow)이 숨 쉬는 것을 바탕에 두고, 가끔 꼭지 하나에서
     **가늘고 긴 빛줄기**가 천천히 번졌다 사라지게 한다. 한 번에 하나만 뜬다. */
  if (look === 'paint') {
    const ray = rayPath;   // 트리 반짝임과 같은 모양을 쓴다(tree-layout.js)
    // [꼭지각(도), 중심에서 거리, 긴 갈래 길이, 시작 어긋남(초)]
    const GLINTS = [[-90, 7.4, 3.4, 0], [-162, 7.0, 2.9, 2.4], [-18, 7.0, 3.1, 4.8]];
    for (const [deg, dist, len, delay] of GLINTS) {
      const a = deg * Math.PI / 180;
      const cx = 50 + Math.cos(a) * dist, cy = STAR_Y + Math.sin(a) * dist;
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'xm-glint');
      g.style.animationDelay = `-${delay}s`;
      const parts = [
        ['circle', { cx, cy, r: 1.3, fill: 'url(#xmSparkGlow)' }],
        ['path', { d: ray(cx, cy, len, 0.16), fill: '#fffdf2', 'fill-opacity': 0.9 }],
        ['path', { d: ray(cx, cy, len * 0.4, 0.1), fill: '#fffdf2', 'fill-opacity': 0.55,
                   transform: `rotate(45 ${cx.toFixed(2)} ${cy.toFixed(2)})` }],
      ];
      for (const [tag, attrs] of parts) {
        const el = document.createElementNS(ns, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        g.appendChild(el);
      }
      art.appendChild(g);
    }
    return;
  }

  for (const [deg, dist, size, dur, delay] of SPARKS) {
    const a = deg * Math.PI / 180;
    const cx = 50 + Math.cos(a) * dist;
    const cy = STAR_Y + Math.sin(a) * dist;
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'xm-spark');
    g.style.setProperty('--sp', dur + 's');
    g.style.animationDelay = `-${delay}s`;
    // 둥근 빛을 먼저 깔고 그 위에 네 갈래를 얹는다(갈래만 두면 종잇조각처럼 보인다)
    const halo = document.createElementNS(ns, 'circle');
    for (const [k, v] of Object.entries({ cx, cy, r: size * 1.5, fill: 'url(#xmSparkGlow)' })) {
      halo.setAttribute(k, v);
    }
    const ray = document.createElementNS(ns, 'path');
    ray.setAttribute('d', sparkPath(cx, cy, size));
    ray.setAttribute('fill', '#fffdf4');
    g.appendChild(halo);
    g.appendChild(ray);
    art.appendChild(g);
  }
})();

/* ── 보기 두 가지 ──────────────────────────────────────────────
   전체 보기   트리 하나가 화면을 꽉 채운다. 멀리서 보는 전시용.
   가까이 보기 카메라가 확대해 꼭대기부터 밑동까지 천천히 훑어 내렸다가
              다시 올라온다. 이때만 오너먼트 밑에 학번과 이름이 뜬다.

   주소에 ?view=zoom 을 붙이면 처음부터 가까이 보기로 열린다(TV에 그대로 띄우는 용).
   구석 단추로도 오갈 수 있고, 고른 보기는 주소에 남아 새로고침해도 유지된다. */
const ZOOM    = 2.0;    // 적어도 이만큼은 당긴다
const ZOOM_MAX = 3.2;   // 세로로 긴 화면에서도 이보다 더 당기지는 않는다
const FILL    = 1.6;    // 당긴 트리가 화면 높이의 이 정도는 되어야 훑을 맛이 난다
const PAN_SEC = 42;     // 꼭대기에서 밑동까지 한 번 훑는 데 걸리는 초
const BAND_ON  = 12;    // 이름이 켜지는 띠의 두께(트리 좌표, 위아래로 이만큼)
const BAND_OFF = 18;    // 꺼지는 선은 넉넉히 둔다 — 같으면 경계에서 깜빡인다
const LAB_DX   = 4.2;   // 이름끼리 이만큼 안 떨어지면 뒤엣것은 차례를 기다린다(가로)
const LAB_DY   = 2.2;   //                                                  (세로)
const MIN_ON   = 2000;  // 한 번 뜬 이름은 적어도 이만큼은 보여 준다(밀리초)
const cam = $('#cam');

/* 배율과 훑을 구간을 화면에 맞춰 셈한다.
   offsetHeight는 transform이 먹기 **전**의 높이다(getBoundingClientRect는 먹은 뒤라
   여기 쓰면 당길 때마다 값이 불어나 제멋대로가 된다).

   트리는 카메라 칸 한가운데 있다. 당기는 기준점이 칸의 위 가운데(transform-origin)이므로
   꼭대기를 화면 위에 맞추려면 위쪽 여백만큼 끌어올려야 하고, 밑동을 화면 바닥에 맞추려면
   거기서 (트리 높이 빼기 화면 높이 나누기 배율)만큼 더 올라가야 한다. */
function fitCamera() {
  const camH  = cam.clientHeight;
  const wrapH = $('#wrap').offsetHeight;
  if (!camH || !wrapH) return;
  // 세로로 긴 화면에서는 트리가 폭에 막혀 짧아진다. 그만큼 더 당겨야 훑을 구간이 생긴다.
  const z   = Math.min(ZOOM_MAX, Math.max(ZOOM, (camH * FILL) / wrapH));
  const gap = (camH - wrapH) / 2;          // 트리 위에 남는 여백
  const p0  = -gap;                        // 꼭대기가 화면 위에 닿는 자리
  const p1  = Math.min(p0, camH / z - gap - wrapH);   // 밑동이 화면 바닥에 닿는 자리
  cam.style.setProperty('--zoom', z.toFixed(3));
  cam.style.setProperty('--pan0', p0.toFixed(1) + 'px');
  cam.style.setProperty('--pan1', p1.toFixed(1) + 'px');
  cam.style.setProperty('--pan-sec', PAN_SEC + 's');
}

function setView(mode) {
  const zoom = mode === 'zoom';
  cam.classList.toggle('zoom', zoom);
  $('#orns').classList.toggle('labels', zoom);
  $('#viewBtn').textContent = zoom ? '전체 보기' : '가까이 보기';
  if (zoom) {
    fitCamera();
  } else {
    cam.style.removeProperty('--zoom');
    cam.style.removeProperty('--pan0');
    cam.style.removeProperty('--pan1');
  }
  if (zoom) startFocus(); else stopFocus();
  schedulePage();   // 보기에 따라 넘기는 간격이 다르다
  const u = new URL(location.href);
  if (zoom) u.searchParams.set('view', 'zoom'); else u.searchParams.delete('view');
  history.replaceState(null, '', u);
}

/* ── 카메라가 보고 있는 띠 ─────────────────────────────────────
   애니메이션이 지금 어디쯤인지를 시간으로 되짚지 않고 **실제로 그려진 자리**에서
   읽는다(getBoundingClientRect는 transform이 먹은 뒤의 값이다). 가속 곡선이나
   브라우저 차이와 무관하게 늘 맞고, 사람이 보기 모드를 바꿔도 저절로 따라온다. */

/**
 * 카메라가 지금 보고 있는 높이(트리 좌표).
 *
 * 처음에는 "화면 한가운데에 무엇이 오는가"로 셈했는데, **그러면 트리 맨 아래가
 * 영영 안 걸린다** — 밑동이 화면 바닥에 닿는 것으로 훑기가 끝나므로 밑동은
 * 화면 한가운데까지 올라오지 않는다. 그래서 160개 중 스무 개 남짓이 한 번도
 * 이름을 못 띄웠다.
 * 지금은 **얼마나 훑었는지(0~1)를 꼭대기부터 밑동까지로 펼친다.** 그래야 처음과
 * 끝에서 트리의 양끝이 꼭 한 번씩 걸린다.
 */
function focusAt() {
  const r = $('#wrap').getBoundingClientRect();
  const travel = r.height - window.innerHeight;     // 훑을 수 있는 거리(화면 밖으로 나간 몫)
  if (!r.height) return null;
  if (travel <= 1) return TREE.vbH / 2;             // 훑을 것이 없으면 가운데만 본다
  const p = Math.min(1, Math.max(0, -r.top / travel));
  return TREE.firstRowY + p * (TREE.baseY - TREE.firstRowY);
}
let camRaf = 0;
let lastFocus = 0;

/* 카메라가 보고 있는 띠 안의 이름을 켠다.

   여기서 맞물려 있는 것이 둘이다.
     · 깜빡이지 않아야 한다 — 매 프레임 주인이 바뀌면 떨리는 것처럼 보인다.
     · 그렇다고 한 이름이 자리를 끝까지 쥐고 있으면 **옆에 밀린 이름은 끝내
       한 번도 못 뜬다**(처음에 이렇게 만들었다가 160개 중 58개가 안 떴다).
   그래서 **아직 한 번도 못 뜬 이름을 먼저 들여보내되, 한 번 뜬 이름은 MIN_ON 동안은
   지우지 않는다.** 자리를 뺏기는 것은 새 이름이 올라올 때뿐이고, 한 이름이 새치기를
   일으키는 것은 띠에 들어올 때 한 번뿐이라 어수선해지지 않는다. */
function updateFocus(now) {
  const focusY = focusAt();
  if (focusY == null) return;

  const want = [];
  const off = [];
  for (const el of nodes.values()) {
    if (el.hidden) continue;        // 지금 안 보이는 그루의 이름은 셈에 넣지 않는다
    const on = el.classList.contains('lab-on');
    const d = Math.abs((+el.dataset.y || 0) - focusY);
    /* 켜는 선(BAND_ON)보다 끄는 선(BAND_OFF)을 넉넉히 잡는다. 두 선이 같으면
       카메라가 느린 구간에서 경계에 걸친 이름이 켜졌다 꺼졌다 한다. */
    if (d >= (on ? BAND_OFF : BAND_ON)) {
      off.push(el);
      if (d >= BAND_OFF) el.dataset.shown = '';   // 띠를 아주 벗어나면 다음 차례를 위해 비운다
      continue;
    }
    want.push({
      el, d,
      x: +el.dataset.x || 50,
      y: +el.dataset.y || 0,
      on,
      keep:  on && (now - (+el.dataset.since || now)) < MIN_ON,  // 아직 지워선 안 되는 때
      fresh: el.dataset.shown !== '1',                           // 이번 차례에 아직 못 뜬 이름
    });
  }

  /* 바짝 붙은 것끼리는 글자가 겹쳐 읽을 수 없다. 자리는 하나만 내준다.
     순서가 이 화면의 전부다.
       1 아직 MIN_ON이 안 지난 것 — 떴다가 바로 지워지면 그것이 깜빡임이다
       2 이번 차례에 아직 못 뜬 이름 — 여기서 밀리면 끝내 한 번도 못 뜬다
       3 이미 떠 있는 것 — 같은 값이면 자리를 옮기지 않는 편이 조용하다
       4 카메라에 가까운 것 */
  want.sort((a, b) =>
    (b.keep ? 1 : 0) - (a.keep ? 1 : 0) ||
    (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0) ||
    (b.on ? 1 : 0) - (a.on ? 1 : 0) ||
    (a.d - b.d));

  const kept = [];
  for (const c of want) {
    const clash = kept.some(k => Math.abs(k.x - c.x) < LAB_DX && Math.abs(k.y - c.y) < LAB_DY);
    if (clash) { off.push(c.el); continue; }
    kept.push(c);
    if (!c.el.classList.contains('lab-on')) {
      c.el.classList.add('lab-on');
      c.el.dataset.since = now;
      c.el.dataset.shown = '1';
    }
  }
  for (const el of off) el.classList.remove('lab-on');
}

function startFocus() {
  if (camRaf) return;
  const tick = now => {
    camRaf = requestAnimationFrame(tick);
    // 0.3초에 한 번이면 넉넉하다. 자주 볼수록 경계에서 들썩이기만 한다.
    if (now - lastFocus < 300) return;
    lastFocus = now;
    updateFocus(now);
  };
  camRaf = requestAnimationFrame(tick);
}

function stopFocus() {
  if (camRaf) cancelAnimationFrame(camRaf);
  camRaf = 0;
  for (const el of nodes.values()) {
    el.classList.remove('lab-on');
    el.dataset.shown = '';
  }
}

$('#viewBtn').addEventListener('click', () => {
  setView(cam.classList.contains('zoom') ? 'full' : 'zoom');
});

// 화면이 바뀌면(TV 해상도 전환, 폰 돌리기) 훑을 구간을 다시 잡는다
window.addEventListener('resize', () => { if (cam.classList.contains('zoom')) fitCamera(); });

/* ── 트리 여러 그루 (2026-11-26) ───────────────────────────────
   한 그루가 TREE_CAP통까지 차면 그루를 하나 더 쓴다. 화면은 하나뿐이므로 나란히
   늘어놓지 않고 **번갈아 보여 준다**(책장 넘기듯). 나란히 두면 그루마다 폭이 절반이
   되어 오너먼트도 절반으로 작아지는데, 그러면 겹침을 피하려 그루를 늘린 뜻이 없어진다.

   넘기는 때는 **한 바퀴가 얼마나 걸리느냐**로 정한다. 그루가 늘수록 한 그루를 보여 주는
   시간을 줄여야 한다 — 자기 편지를 보러 온 학생은 자기 그루가 올 때까지 서서 기다린다.
   그루 한 개당 30초로 묶어 두면 그루 여섯이면 한 바퀴에 3분이다.
     · 전체 보기 — 한 그루에 PAGE_SEC, 다만 한 바퀴가 ROUND_SEC를 넘으면 그만큼 줄인다.
       그래도 PAGE_MIN보다 짧게는 안 한다(눈이 따라가지 못한다).
     · 가까이 보기 — 꼭대기에서 밑동까지 **한 번 훑고** 넘긴다(PAN_SEC). 훑는 중간에
       바뀌면 보던 사람이 자리를 잃는다. 넘길 때 카메라를 되감으므로 새 그루도
       꼭대기부터 시작한다(그루가 하나뿐이면 예전처럼 내려갔다 올라온다). */
const PAGE_SEC  = 30;   // 전체 보기에서 한 그루를 보여 주는 시간
const PAGE_MIN  = 12;   // 그루가 아무리 많아도 이보다 짧게 보여 주지 않는다
const ROUND_SEC = 120;  // 모든 그루를 한 바퀴 도는 데 목표로 하는 시간
let curPage = 0;
let pageTimer = 0;
let lastPages = 1;

function schedulePage() {
  clearTimeout(pageTimer);
  pageTimer = 0;
  const pages = pageCount(visible().length);
  if (pages < 2) return;
  const sec = cam.classList.contains('zoom')
    ? PAN_SEC
    : Math.max(PAGE_MIN, Math.min(PAGE_SEC, ROUND_SEC / pages));
  pageTimer = setTimeout(nextPage, sec * 1000);
}

function nextPage() {
  const pages = pageCount(visible().length);
  if (pages < 2) return;
  curPage = (curPage + 1) % pages;
  render();
  /* 새 그루도 꼭대기부터 훑게 카메라를 되감는다. animation을 한 번 끊어야 다시
     시작한다(class를 떼었다 붙이면 fitCamera가 넣어 둔 값까지 날아간다). */
  if (cam.classList.contains('zoom')) {
    stopFocus();
    cam.style.animation = 'none';
    void cam.offsetWidth;
    cam.style.animation = '';
    startFocus();
  }
  schedulePage();
}

$('#nextTree').addEventListener('click', nextPage);

/* ── 선생님 모드 ───────────────────────────────────────────────
   teacher.html에서 네 자리 번호를 확인하면 같은 탭의 sessionStorage에 그 선생님께
   온 편지가 id와 본문까지 들어간다. 그러면 트리는 **그 편지만** 달아 보여 주고,
   하나를 누르면 화면 가운데에 그 편지가 뜬다. 트리 전체 보기로 바꾸면 모든 편지가
   다시 달리고 내 것만 빛난다.
   학생이 보는 보통의 트리에는 이 정보가 전혀 없다(그냥 오너먼트뿐).

   세션은 같은 탭에만 두므로 새로고침해도 그대로 이어지고, 탭을 닫으면 지워진다. */
let mineIds = null;              // 내 편지 id
const mineLetters = new Map();   // id → 편지(본문까지)
let mineName = '';
let mineOnly = false;            // 내 편지만 달아 보여 주는 보기

try {
  const m = JSON.parse(sessionStorage.getItem('xmas_mine') || 'null');
  if (m && Array.isArray(m.ids)) {
    mineIds = new Set(m.ids);
    mineName = m.name || '';
    for (const l of (m.letters || [])) mineLetters.set(l.id, l);
    mineOnly = sessionStorage.getItem('xmas_mineonly') !== 'all';   // 기본은 내 편지만
    $('#mineLabel').textContent = `${mineName} 선생님께 온 편지 ${m.ids.length}통`;
    $('#minebar').classList.add('on');
    $('#orns').classList.add('mine');
  }
} catch { mineIds = null; }

// 처음 보기를 화면에 반영한다(render는 아직 쓸 수 없다 — items가 아래에 있다)
document.body.classList.toggle('mineonly', mineOnly);
if (mineIds) $('#mineToggle').textContent = mineOnly ? '트리 전체 보기' : '내 편지만 보기';

/** 지금 트리에 달 편지. 내 편지만 보기에서는 그 선생님 것만 남긴다. */
function visible() {
  return (mineOnly && mineIds) ? items.filter(it => mineIds.has(it.id)) : items;
}

function setMineOnly(on) {
  mineOnly = on && !!mineIds;
  sessionStorage.setItem('xmas_mineonly', mineOnly ? 'mine' : 'all');
  document.body.classList.toggle('mineonly', mineOnly);
  $('#mineToggle').textContent = mineOnly ? '트리 전체 보기' : '내 편지만 보기';
  curPage = 0;
  render();
}
$('#mineToggle').addEventListener('click', () => setMineOnly(!mineOnly));

$('#mineOut').addEventListener('click', () => {
  sessionStorage.removeItem('xmas_mine');
  sessionStorage.removeItem('xmas_mineonly');
  location.href = 'teacher.html';
});

/* ── 편지 한 통 열어 보기 ──────────────────────────────────────
   본문은 sessionStorage에 든 것만 쓴다 — 트리 화면은 편지 본문을 Firestore에서
   읽을 수 없다(규칙이 막는다). 그래서 번호를 맞힌 선생님의 편지만 열린다. */
const modal = $('#letterModal');

function openLetter(l) {
  $('#letterCard').innerHTML = `
    <div class="xm-letter-head">
      ${ornamentSVG(l.ornament, 34)}
      <div class="xm-letter-who">
        ${esc(l.studentName || '')}
        <small>${esc(studentIdLabel(l.studentId))}</small>
      </div>
    </div>
    <div class="xm-letter-body">${nl2br(l.body)}</div>
    <div class="xm-letter-foot"><span>${esc(fmtDateTime(l.createdAt))}</span></div>`;
  modal.showModal();
}

$('#orns').addEventListener('click', e => {
  const el = e.target.closest('.xm-hang');
  if (!el) return;
  const l = mineLetters.get(el.dataset.id);
  if (l) openLetter(l);
});
$('#letterClose').addEventListener('click', () => modal.close());
// 바깥을 눌러도 닫힌다(dialog 자신이 받는 클릭은 가려진 배경을 누른 것이다)
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });

// ── 오너먼트 걸기 ─────────────────────────────────────────────
let items = [];                 // [{id, ornament, x, y, studentId, studentName}] 걸린 순서
const nodes = new Map();        // id → 화면 요소
let firstPaint = true;

/** 가까이 봤을 때 오너먼트 밑에 뜨는 두 줄. 학번과 이름이 없는 문서는 그냥 비운다. */
function labelHTML(it) {
  if (!it.studentId && !it.studentName) return '';
  return `<span class="xm-lab">${esc(it.studentId || '')}<i>${esc(it.studentName || '')}</i></span>`;
}

function render(freshIds = new Set()) {
  const wrap = $('#orns');
  const list = visible();
  const pages = pageCount(list.length);
  if (curPage >= pages) curPage = 0;
  /* 그루마다 따로 자리를 셈한다 — 학생이 고른 자리(x, y)가 있으면 그대로, 없는 옛
     문서만 자동으로 채운다. 오너먼트 크기도 **그 그루에 걸린 통수**로 정해진다. */
  const placed = [];
  for (let p = 0; p < pages; p++) {
    for (const q of placeAll(list.slice(p * TREE_CAP, (p + 1) * TREE_CAP))) {
      placed.push({ ...q, page: p });
    }
  }
  const byId = new Map(list.map(it => [it.id, it]));

  // 사라진 것 치우기(어드민에서 숨긴 편지)
  for (const [id, el] of nodes) {
    if (!byId.has(id)) { el.remove(); nodes.delete(id); }
  }

  for (const p of placed) {
    let el = nodes.get(p.id);
    if (!el) {
      const it = byId.get(p.id);
      el = document.createElement('div');
      el.className = 'xm-hang';
      el.innerHTML = `<span class="xm-sway">${ornamentSVG(it.ornament, 64)}</span>${labelHTML(it)}`;
      // 같은 모양이라도 박자와 폭이 달라야 한 몸처럼 움직이지 않는다
      const sway = el.querySelector('.xm-sway');
      sway.style.setProperty('--sway', (4.2 + Math.random() * 2.8).toFixed(2) + 's');
      sway.style.setProperty('--tilt', (2.1 + Math.random() * 1.9).toFixed(2) + 'deg');
      sway.style.animationDelay = `-${(Math.random() * 6).toFixed(2)}s`;
      // 반짝임은 안쪽 그림에 걸고, 절반 남짓만 켠다(까닭은 xmas.css에)
      if (Math.random() < 0.55) {
        el.classList.add('tw');
        const art = sway.firstElementChild;
        art.style.setProperty('--tw', (2.4 + Math.random() * 3.2).toFixed(2) + 's');
        art.style.animationDelay = `-${(Math.random() * 6).toFixed(2)}s`;
      }
      if (!firstPaint && freshIds.has(p.id)) {
        el.classList.add('fresh');
        setTimeout(() => el.classList.remove('fresh'), 1400);
      }
      wrap.appendChild(el);
      nodes.set(p.id, el);
    }
    el.dataset.id = p.id;   // 눌렀을 때 어느 편지인지 알려면 필요하다
    el.classList.toggle('mine', !!(mineIds && mineIds.has(p.id)));
    // 띠 안에 드는지, 이웃 이름과 겹치지 않는지 보려고 트리 좌표를 적어 둔다
    el.dataset.x = p.x;
    el.dataset.y = p.y;
    el.style.left  = p.x + '%';
    el.style.top   = (p.y / TREE.vbH * 100) + '%';
    el.style.width = p.w + '%';
    /* 지금 보고 있는 그루만 보인다. 지우지 않고 감추는 까닭은, 그루를 넘길 때마다
       삼백 장을 다시 만들면 큰 화면에서 눈에 보이게 덜컥거리기 때문이다. */
    el.hidden = p.page !== curPage;
  }

  $('#treeEmpty').hidden = list.length > 0;
  $('#nextTree').hidden = pages < 2;
  $('#foot').innerHTML = mineOnly && mineIds
    /* 공개일 전이면 본문이 오지 않는다(함수가 id만 준다) — 눌러도 안 열리니 그렇게 적는다 */
    ? (!list.length ? ''
        : mineLetters.size ? '오너먼트를 하나씩 눌러 읽어 보세요'
        : '편지는 공개되는 날부터 읽을 수 있어요')
    : (items.length
        ? `지금까지 <b>${items.length}</b>통의 마음이 모였어요`
          + (pages > 1 ? ` · ${curPage + 1}번째 트리 (모두 ${pages}그루)` : '')
        : '');
  // 그루 수가 변한 때만 시계를 다시 건다(편지가 들어올 때마다 되감으면 안 넘어간다)
  if (pages !== lastPages) { lastPages = pages; schedulePage(); }
  firstPaint = false;
}

/* 처음 보기를 정한다. nodes와 render가 다 만들어진 뒤라야 한다 —
   setView가 띠 따라가기를 켜고 끄면서 nodes를 건드린다. */
setView(new URLSearchParams(location.search).get('view') === 'zoom' ? 'zoom' : 'full');

/* 미리보기: ?demo=160 이면 Firebase를 보지 않고 가짜 트리를 그린다.
   축제 당일처럼 꽉 찬 트리를 실제 컬렉션을 더럽히지 않고 보려고 둔 길이다. */
const DEMO = demoCount();
if (DEMO) {
  mountDemoBadge(DEMO);
  items = demoOrnaments(DEMO);
  render();
} else {

/* 오너먼트 문서에는 모양과 자리, 그리고 쓴 사람의 학번과 이름만 있다.
   받는 선생님은 들어 있지 않다 — 그래서 트리를 들여다봐도 누가 누구에게
   썼는지는 알 수 없다(그 둘을 잇는 것은 관리자만 읽는 편지 문서뿐이다). */
onSnapshot(query(collection(db, C_ORNAMENTS), orderBy('createdAt')),
  snap => {
    const fresh = new Set();
    snap.docChanges().forEach(ch => { if (ch.type === 'added') fresh.add(ch.doc.id); });
    items = snap.docs.map(d => {
      const v = d.data();
      return {
        id: d.id, ornament: v.ornament, x: v.x, y: v.y,
        studentId: v.studentId, studentName: v.studentName,
      };
    });
    render(fresh);
  },
  err => {
    console.error(err);
    $('#foot').textContent = '트리를 불러오지 못했어요. 새로고침해 주세요.';
  });
}
</script>
</body>
</html>
