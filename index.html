<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>선생님께 보내는 감사편지</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a1622'/><path d='M16 6.5 11 16h10z' fill='%232b7152'/><path d='M16 12 9 24h14z' fill='%231b4e3b'/><rect x='14.6' y='23' width='2.8' height='4' rx='1' fill='%235b4029'/><circle cx='16' cy='5' r='2.6' fill='%23f0c457'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="xmas.css">
  <style>
    /* 공용 태블릿이라 글자를 길게 눌러 고르는 동작이 거슬린다. 입력칸만 예외로 둔다. */
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { -webkit-user-select: text; user-select: text; }

    /* 멈춰 둔 태블릿을 치우는 안내 */
    .xm-idle {
      position: fixed; inset: 0; z-index: 60;
      display: none; align-items: center; justify-content: center;
      background: rgba(6,17,32,.86);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      padding: 24px;
    }
    .xm-idle.on { display: flex }
    .xm-idle-box {
      background: var(--hi-bg-elevated);
      border: 1px solid var(--hi-border-faint);
      border-radius: 22px;
      padding: 30px 26px;
      text-align: center;
      max-width: 380px;
    }
    .xm-idle-box h3 { font-size: 21px; font-weight: 800; margin: 0 0 10px; letter-spacing: -.4px }
    .xm-idle-box p  { color: var(--hi-text-muted); font-size: 15px; line-height: 1.7; margin: 0 0 20px }
    .xm-idle-box b  { color: var(--hi-accent); font-weight: 800 }

    /* 태블릿은 세로로 길어 위쪽에만 몰리면 허전하다. 가운데로 모아 둔다.
       (justify-content 대신 auto 여백을 쓴다 — 내용이 화면보다 길어져도 위가 잘리지 않는다.) */
    #app, #closed { width: 100%; margin: auto 0 }

    /* 고른 선생님을 편지 쓰는 동안 머리에 붙여 둔다 */
    .xm-chosen {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 14px; border-radius: 999px;
      background: var(--hi-accent-soft); color: var(--hi-accent);
      font-size: 14px; font-weight: 700; margin-bottom: 14px;
    }
    .xm-pickwrap { text-align: center }
    .xm-pickwrap .xm-opick { width: 100% }

    /* ── 자리 고르는 트리 ── */
    .xm-pickpanel { padding: 16px 14px 20px }
    .xm-picktree {
      position: relative;
      aspect-ratio: 100 / 130;
      /* 손가락으로 찍어야 하니 되도록 크게. 버튼 줄과 머리말 몫만 덜어 둔다.
         dvh로 둔다 — 폰은 주소창이 들락거려 vh로 두면 트리가 화면보다 커진다. */
      width: min(100%, 58dvh * 100 / 130);
      margin: 0 auto;
      cursor: crosshair;
      touch-action: manipulation;   /* 두 번 눌러 확대되는 것 막기 */
    }
    .xm-picktree > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
    /* 이미 걸린 것들은 자리만 알아보게 흐리게 둔다(남의 편지라 눈에 띌 이유가 없다) */
    .xm-picktree .xm-orns .xm-hang { opacity: .5 }
    .xm-picktree .xm-hang .xm-sway { animation: none }

    /* 내가 고른 자리에 미리 걸어 보는 것 */
    .xm-ghost {
      position: absolute;
      transform: translate(-50%, -42%);
      pointer-events: none;
      filter: drop-shadow(0 0 9px rgba(255,235,170,.85));
      animation: xm-ghostin .32s cubic-bezier(.3,1.5,.6,1);
    }
    .xm-ghost svg { display: block; width: 100%; height: auto }
    @keyframes xm-ghostin {
      0%   { transform: translate(-50%, -78%) scale(.5) }
      100% { transform: translate(-50%, -42%) scale(1) }
    }
    .xm-pickhint {
      text-align: center; font-size: 13px; color: var(--hi-text-muted);
      margin: 10px 0 0; min-height: 20px;
    }
    @media (prefers-reduced-motion: reduce) { .xm-ghost { animation: none } }

    /* 폰으로 들어오는 학생도 있다. 이 칸은 단추를 한 줄로 두고 트리를 줄인다 —
       세로로 쌓으면 단추 셋이 200px 가까이 먹어 [이전]이 화면 밖으로 밀렸다.
       문구가 다 짧아서 한 줄에 들어간다. */
    @media (max-width: 600px) {
      .xm-picktree { width: min(100%, 44dvh * 100 / 130) }
      .xm-pickpanel { padding: 14px 12px 16px }
      .xm-pickpanel .xm-actions { flex-direction: row; flex-wrap: nowrap; gap: 8px }
      .xm-pickpanel .xm-actions .xm-btn {
        flex: 1 1 0; min-width: 0; padding-left: 10px; padding-right: 10px; font-size: 15px;
      }
    }
  </style>
</head>
<body class="hi-preset-xmas xm-body">
  <div class="xm-sky"></div>
  <div class="xm-stars"></div>
  <canvas class="xm-snow" id="snow"></canvas>

  <main class="xm-stage">
    <div class="xm-top">
      <div class="xm-brand"><span data-icon="tree-pine" data-icon-size="20"></span><span id="brandName">감사편지 트리</span></div>
      <button class="xm-btn xm-btn-ghost xm-btn-sm" id="resetBtn" type="button" hidden>처음으로</button>
    </div>

    <!-- 받는 중일 때만 보이는 본문 -->
    <div id="app" hidden>
      <div class="xm-steps" id="steps" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <!-- 1단계 — 나를 밝히기 -->
      <section class="xm-step" id="step1">
        <h1 class="xm-title" id="cfgTitle">선생님께 보내는 감사편지</h1>
        <p class="xm-sub" id="cfgSub">마음을 적어 트리에 달아 주세요</p>
        <div class="xm-panel">
          <div class="xm-field">
            <label class="xm-label" for="sid">학번</label>
            <input class="xm-input" id="sid" type="text" inputmode="numeric" maxlength="5"
                   placeholder="30101" autocomplete="off" enterkeyhint="next">
          </div>
          <div class="xm-field">
            <label class="xm-label" for="sname">이름</label>
            <input class="xm-input" id="sname" type="text" maxlength="10"
                   placeholder="이름" autocomplete="off" enterkeyhint="done">
          </div>
          <div class="xm-err" id="err1"></div>
          <div class="xm-actions">
            <button class="xm-btn" id="go1" type="button" disabled>선생님 고르기</button>
          </div>
        </div>
      </section>

      <!-- 2단계 — 선생님 고르기 -->
      <section class="xm-step" id="step2">
        <h1 class="xm-title">누구에게 보낼까요</h1>
        <p class="xm-sub">편지를 받으실 선생님을 골라 주세요</p>
        <div class="xm-panel">
          <div class="xm-tsearch">
            <input class="xm-input" id="tq" type="text" placeholder="선생님 이름 찾기" autocomplete="off">
          </div>
          <div class="xm-tgrid" id="tgrid"></div>
          <div class="xm-actions">
            <button class="xm-btn xm-btn-ghost" id="back2" type="button">이전</button>
            <button class="xm-btn" id="go2" type="button" disabled>편지 쓰기</button>
          </div>
        </div>
      </section>

      <!-- 3단계 — 편지 쓰기 -->
      <section class="xm-step" id="step3">
        <h1 class="xm-title">마음을 적어 주세요</h1>
        <p class="xm-sub">선생님께 전하고 싶은 이야기를 써 보세요</p>
        <div class="xm-panel">
          <div class="xm-paper">
            <div class="xm-paper-to" id="paperTo"></div>
            <textarea id="body" placeholder="선생님, 올 한 해 정말 고마웠습니다." spellcheck="false"></textarea>
            <div class="xm-paper-foot">
              <span id="paperFrom"></span>
              <span class="xm-count" id="count">0 / 400</span>
            </div>
          </div>
          <div class="xm-err" id="err3"></div>
          <div class="xm-actions">
            <button class="xm-btn xm-btn-ghost" id="back3" type="button">이전</button>
            <button class="xm-btn" id="go3" type="button" disabled>오너먼트 고르기</button>
          </div>
        </div>
      </section>

      <!-- 4단계 — 오너먼트 고르기 -->
      <section class="xm-step" id="step4">
        <h1 class="xm-title">어떤 장식으로 달까요</h1>
        <p class="xm-sub">트리에 걸릴 모양을 골라 주세요</p>
        <div class="xm-panel">
          <div class="xm-ogrid" id="ogrid"></div>
          <div class="xm-err" id="err4"></div>
          <div class="xm-actions">
            <button class="xm-btn xm-btn-ghost" id="back4" type="button">이전</button>
            <button class="xm-btn" id="go4" type="button" disabled>자리 고르기</button>
          </div>
        </div>
      </section>

      <!-- 5단계 — 트리에서 자리 고르기 -->
      <section class="xm-step" id="step5">
        <h1 class="xm-title">어디에 달까요</h1>
        <p class="xm-sub">트리를 눌러 자리를 골라 주세요</p>
        <div class="xm-panel xm-pickpanel">
          <div class="xm-picktree" id="pickWrap">
            <svg viewBox="0 0 100 130" preserveAspectRatio="xMidYMid meet" aria-label="크리스마스트리">
              <ellipse cx="50" cy="128" rx="46" ry="7.5" fill="#dceaf7" opacity=".10"/>
              <rect x="45.5" y="112" width="9" height="13" rx="3" fill="#6b4a2e"/>
              <g id="pickArt"></g>
            </svg>
            <div class="xm-orns" id="pickOrns"></div>
            <div class="xm-ghost" id="ghost" hidden></div>
          </div>
          <div class="xm-err" id="err5"></div>
          <div class="xm-actions">
            <button class="xm-btn xm-btn-ghost" id="back5" type="button">이전</button>
            <button class="xm-btn xm-btn-ghost" id="anySpot" type="button">아무 데나</button>
            <button class="xm-btn" id="go5go" type="button" disabled>여기에 달기</button>
          </div>
        </div>
      </section>

      <!-- 6단계 — 다 됐어요 -->
      <section class="xm-step" id="step6">
        <div class="xm-panel xm-done">
          <div id="doneOrn"></div>
          <h2>트리에 달렸어요</h2>
          <p id="doneMsg"></p>
          <div class="xm-back-note">잠시 뒤 처음 화면으로 돌아갑니다 (<b id="tick">6</b>)</div>
          <div class="xm-actions">
            <button class="xm-btn" id="doneBack" type="button">지금 처음으로</button>
          </div>
        </div>
      </section>
    </div>

    <!-- 받기를 멈췄을 때 -->
    <div id="closed" hidden>
      <div class="xm-panel xm-done">
        <span data-icon="tree-pine" data-icon-size="64" class="xm-seal-ic"></span>
        <h2>지금은 편지를 받지 않아요</h2>
        <p>다음에 다시 찾아와 주세요.</p>
      </div>
    </div>

    <!-- 첫 화면을 그리기 전 -->
    <div id="loading" class="xm-empty">불러오는 중…</div>
  </main>

  <!-- 자리를 비운 태블릿 정리 -->
  <div class="xm-idle" id="idle">
    <div class="xm-idle-box">
      <h3>아직 쓰고 계신가요</h3>
      <p>계속 쓰지 않으면 <b id="idleTick">15</b>초 뒤에<br>처음 화면으로 돌아갑니다.</p>
      <button class="xm-btn xm-btn-block" id="idleKeep" type="button">계속 쓸게요</button>
    </div>
  </div>

<script type="module">
import { collection, doc, getDocs, query, orderBy, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, C_LETTERS, C_ORNAMENTS, C_TEACHERS, watchConfig, esc, studentIdLabel, mountSnow }
  from "./xmas-core.js";
import { ORNAMENTS, ornamentSVG } from "./ornaments.js";
import { TREE, TIERS, tierPath, starPath, placeAll, clampSpot, nudgeFree, autoSpot, ORN_W, ornHeight }
  from "./tree-layout.js";
import { icon } from "./shared/icons.js";
import { containsBadWord } from "./shared/profanity.js";
import { demoCount, demoOrnaments, demoTeachers, mountDemoBadge } from "./demo-data.js";

const $ = s => document.querySelector(s);

/* ── 공용 태블릿 규칙 ──────────────────────────────────────────
   한 사람이 끝내면 흔적을 남기지 않는다. 보내고 나면 당연히 지우고,
   쓰다 말고 자리를 떠난 경우에도 지운다 — 안 그러면 다음 학생이 앞사람 편지를
   그대로 보게 된다. 그래서 저장하는 곳은 메모리 변수뿐이고
   sessionStorage나 localStorage에 아무것도 남기지 않는다. */
const IDLE_MS  = 150000;   // 2분 30초 동안 아무 것도 안 하면 묻는다
const IDLE_ACK = 15;       // 물어본 뒤 기다리는 초
const DONE_SEC = 6;        // 다 보내고 처음 화면으로 돌아가기까지

let cfg = null;
let teachers = [];
let step = 1;
const form = { sid: '', name: '', teacherId: '', teacherName: '', body: '', ornament: '', x: null, y: null };
let sending = false;

/* 미리보기: ?demo=160 이면 Firebase를 보지 않고 가짜 선생님과 가짜 오너먼트로
   축제 당일처럼 꽉 찬 화면을 그린다. 이 모드에서는 실제로 저장하지 않는다. */
const DEMO = demoCount();
mountDemoBadge(DEMO);

// ── 눈과 아이콘 ────────────────────────────────────────────────
mountSnow($('#snow'));
function paintIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = icon(el.dataset.icon, el.dataset.iconSize ? +el.dataset.iconSize : 24);
    el.removeAttribute('data-icon');
  });
}
paintIcons();

// ── 설정 ──────────────────────────────────────────────────────
watchConfig(c => {
  cfg = c;
  $('#loading').hidden = true;
  $('#cfgTitle').textContent = c.title;
  $('#cfgSub').textContent = c.sub;
  $('#brandName').textContent = c.title.length > 12 ? '감사편지 트리' : c.title;
  document.title = c.title;
  // 받기를 멈추면 쓰던 것도 지우고 닫는다(설정이 바뀌는 즉시 태블릿이 따라온다).
  if (c.closed) {
    $('#app').hidden = true;
    $('#closed').hidden = false;
    resetAll();
  } else {
    $('#closed').hidden = true;
    $('#app').hidden = false;
  }
  renderCount();
});

// ── 단계 ──────────────────────────────────────────────────────
function show(n) {
  step = n;
  document.querySelectorAll('.xm-step').forEach(el => el.classList.remove('on'));
  $('#step' + n).classList.add('on');
  const dots = $('#steps').children;
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = (i + 1 === n) ? 'on' : (i + 1 < n ? 'done' : '');
  }
  $('#steps').style.visibility = n >= 6 ? 'hidden' : '';
  $('#resetBtn').hidden = (n === 1 || n === 6);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  bumpIdle();
}

/** 입력을 모두 비우고 첫 화면으로 — 보내고 난 뒤와 자리를 비웠을 때 둘 다 여기로 온다 */
function resetAll() {
  form.sid = form.name = form.teacherId = form.teacherName = form.body = form.ornament = '';
  form.x = form.y = null;
  $('#ghost').hidden = true;
  $('#sid').value = ''; $('#sname').value = '';
  $('#tq').value = '';  $('#body').value = '';
  ['#err1', '#err3', '#err4'].forEach(s => { $(s).textContent = ''; });
  $('#sid').classList.remove('bad'); $('#sname').classList.remove('bad');
  renderTeachers(); renderOrnaments(); renderCount(); validate1();
  show(1);
  stopDoneTimer();
}

// ── 1단계: 학번과 이름 ────────────────────────────────────────
const SID_RE = /^\d{5}$/;
function validate1() {
  const sid = $('#sid').value.trim();
  const nm  = $('#sname').value.trim();
  $('#go1').disabled = !(SID_RE.test(sid) && nm.length >= 2);
}
$('#sid').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
  e.target.classList.remove('bad');
  $('#err1').textContent = '';
  validate1();
  if (SID_RE.test(e.target.value)) $('#sname').focus();
});
$('#sname').addEventListener('input', e => {
  e.target.classList.remove('bad');
  $('#err1').textContent = '';
  validate1();
});
$('#sname').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('#go1').disabled) $('#go1').click(); });

$('#go1').addEventListener('click', () => {
  const sid = $('#sid').value.trim();
  const nm  = $('#sname').value.trim();
  if (!SID_RE.test(sid)) { $('#sid').classList.add('bad'); $('#err1').textContent = '학번을 다시 확인해 주세요.'; return; }
  if (nm.length < 2 || /\d/.test(nm)) { $('#sname').classList.add('bad'); $('#err1').textContent = '이름을 다시 확인해 주세요.'; return; }
  form.sid = sid; form.name = nm;
  show(2);
  $('#tq').focus();
});

// ── 2단계: 선생님 고르기 ──────────────────────────────────────
async function loadTeachers() {
  if (DEMO) { teachers = demoTeachers(); renderTeachers(); return; }
  try {
    const snap = await getDocs(query(collection(db, C_TEACHERS), orderBy('order')));
    teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.name);
  } catch {
    // order 필드가 없는 문서가 섞여 있어도 목록은 떠야 한다
    try {
      const snap = await getDocs(collection(db, C_TEACHERS));
      teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.name)
        .sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
    } catch { teachers = []; }
  }
  renderTeachers();
}

function renderTeachers() {
  const q = $('#tq').value.trim();
  const list = q ? teachers.filter(t =>
    String(t.name).includes(q) || String(t.subject || '').includes(q)) : teachers;
  if (!teachers.length) {
    $('#tgrid').innerHTML = '<div class="xm-empty">아직 등록된 선생님이 없어요.<br>선생님께 알려 주세요.</div>';
  } else if (!list.length) {
    $('#tgrid').innerHTML = '<div class="xm-empty">찾는 선생님이 없어요.</div>';
  } else {
    $('#tgrid').innerHTML = list.map(t =>
      `<button class="xm-tcard${t.id === form.teacherId ? ' sel' : ''}" type="button" data-id="${esc(t.id)}">
         <b>${esc(t.name)} 선생님</b>${t.subject ? `<span>${esc(t.subject)}</span>` : ''}
       </button>`).join('');
  }
  $('#go2').disabled = !form.teacherId;
}

$('#tq').addEventListener('input', renderTeachers);
$('#tgrid').addEventListener('click', e => {
  const btn = e.target.closest('.xm-tcard');
  if (!btn) return;
  const t = teachers.find(x => x.id === btn.dataset.id);
  if (!t) return;
  form.teacherId = t.id;
  form.teacherName = t.name;
  renderTeachers();
});
$('#back2').addEventListener('click', () => show(1));
$('#go2').addEventListener('click', () => {
  if (!form.teacherId) return;
  $('#paperTo').textContent = `${form.teacherName} 선생님께`;
  $('#paperFrom').textContent = `${studentIdLabel(form.sid)} ${form.name}`;
  show(3);
  $('#body').focus();
});

// ── 3단계: 편지 쓰기 ──────────────────────────────────────────
const noSpace = s => s.replace(/\s/g, '').length;

function renderCount() {
  const max = cfg ? cfg.maxLen : 400;
  const min = cfg ? cfg.minLen : 20;
  const v = $('#body').value;
  $('#count').textContent = `${v.length} / ${max}`;
  $('#count').classList.toggle('over', v.length > max);
  $('#go3').disabled = !(noSpace(v) >= min && v.length <= max);
}
$('#body').addEventListener('input', () => { $('#err3').textContent = ''; renderCount(); });

$('#back3').addEventListener('click', () => show(2));
$('#go3').addEventListener('click', () => {
  const v = $('#body').value.trim();
  const max = cfg ? cfg.maxLen : 400;
  if (v.length > max) { $('#err3').textContent = '편지가 조금 길어요. 줄여 주세요.'; return; }
  if (containsBadWord(v)) {
    $('#err3').textContent = '편지에 쓸 수 없는 말이 있어요. 다시 살펴봐 주세요.';
    return;
  }
  form.body = v;
  show(4);
});

// ── 4단계: 오너먼트 고르기 ────────────────────────────────────
function renderOrnaments() {
  $('#ogrid').innerHTML = ORNAMENTS.map(o =>
    `<button class="xm-opick${o.key === form.ornament ? ' sel' : ''}" type="button" data-key="${o.key}">
       ${ornamentSVG(o.key, 62)}<span>${esc(o.name)}</span>
     </button>`).join('');
  $('#go4').disabled = !form.ornament;
}
$('#ogrid').addEventListener('click', e => {
  const btn = e.target.closest('.xm-opick');
  if (!btn) return;
  form.ornament = btn.dataset.key;
  $('#err4').textContent = '';
  renderOrnaments();
});
$('#back4').addEventListener('click', () => show(3));

// ── 5단계: 트리에서 자리 고르기 ───────────────────────────────
/* 자리를 학생이 직접 고르므로 좌표를 문서에 저장한다. 덕분에 오너먼트를
   편지 수와 상관없이 큼직한 한 크기로 둘 수 있고, 편지가 늘어도 남이 걸어 둔
   것이 움직이지 않는다. 자세한 사정은 tree-layout.js 주석에 적어 두었다. */
let taken = [];          // 이미 걸린 자리들 [{x, y}]
let treeDrawn = false;

function drawPickTree() {
  if (treeDrawn) return;
  treeDrawn = true;
  const art = $('#pickArt');
  const ns = 'http://www.w3.org/2000/svg';
  const add = (tag, attrs) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    art.appendChild(el);
  };
  for (let i = TIERS.length - 1; i >= 0; i--) {
    const t = TIERS[i];
    add('path', { d: tierPath(t, 2.2), fill: t.shade });
    add('path', { d: tierPath(t), fill: t.fill });
  }
  add('path', { d: starPath(50, 11, 8.4, 3.5), fill: '#f7d479' });
}

/** 이미 걸린 것들을 트리에 깔아 둔다(빈자리를 눈으로 찾게) */
function paintTaken(items) {
  const placed = placeAll(items);
  taken = placed.map(p => ({ x: p.x, y: p.y }));
  const byId = new Map(items.map(it => [it.id, it]));
  $('#pickOrns').innerHTML = placed.map(p =>
    `<div class="xm-hang" style="left:${p.x}%;top:${(p.y / TREE.vbH * 100)}%;width:${p.w}%">
       <span class="xm-sway">${ornamentSVG(byId.get(p.id).ornament, 64)}</span>
     </div>`).join('');
}

/** 이미 걸린 오너먼트를 불러온다 */
async function loadTaken() {
  if (DEMO) { paintTaken(demoOrnaments(DEMO)); return; }
  try {
    const snap = await getDocs(query(collection(db, C_ORNAMENTS), orderBy('createdAt')));
    paintTaken(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  } catch (e) {
    // 못 불러와도 자리는 고를 수 있어야 한다(겹칠 뿐이다)
    console.warn(e);
    taken = [];
    $('#pickOrns').innerHTML = '';
  }
}

/** 고른 자리에 내 오너먼트를 미리 걸어 본다 */
function paintGhost() {
  const g = $('#ghost');
  if (form.x == null) { g.hidden = true; return; }
  g.hidden = false;
  g.style.left = form.x + '%';
  g.style.top = (form.y / TREE.vbH * 100) + '%';
  g.style.width = ORN_W + '%';
  g.innerHTML = ornamentSVG(form.ornament, 64);
  // 다시 찍을 때마다 톡 하고 내려앉게
  g.style.animation = 'none';
  void g.offsetWidth;
  g.style.animation = '';
}

function pickAt(clientX, clientY) {
  const r = $('#pickWrap').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const vx = ((clientX - r.left) / r.width) * 100;
  const vy = ((clientY - r.top) / r.height) * TREE.vbH;
  // 찍은 자리를 가지 안으로 끌어오고, 이미 걸린 것과 겹치면 옆으로 밀어 준다
  const spot = nudgeFree(vx, vy, taken);
  form.x = +spot.x.toFixed(2);
  form.y = +spot.y.toFixed(2);
  $('#err5').textContent = '';
  $('#go5go').disabled = false;
  paintGhost();
}

$('#pickWrap').addEventListener('pointerdown', e => {
  e.preventDefault();
  pickAt(e.clientX, e.clientY);
});

$('#anySpot').addEventListener('click', () => {
  const spot = autoSpot(taken, form.sid + form.body.slice(0, 12) + Date.now());
  form.x = +spot.x.toFixed(2);
  form.y = +spot.y.toFixed(2);
  $('#err5').textContent = '';
  $('#go5go').disabled = false;
  paintGhost();
});

$('#back5').addEventListener('click', () => show(4));

$('#go4').addEventListener('click', async () => {
  if (!form.ornament) return;
  form.x = form.y = null;
  $('#ghost').hidden = true;
  $('#go5go').disabled = true;
  drawPickTree();
  show(5);
  await loadTaken();
});

// ── 보내기 ────────────────────────────────────────────────────
$('#go5go').addEventListener('click', send);

async function send() {
  if (sending || !form.ornament || form.x == null) return;
  if (cfg && cfg.closed) { $('#err5').textContent = '지금은 편지를 받지 않아요.'; return; }
  sending = true;
  $('#go5go').disabled = true;
  $('#go5go').textContent = '다는 중…';
  try {
    /* 편지와 오너먼트를 한 번에 쓴다 —
       트리 화면이 읽는 것은 오너먼트 문서뿐이고(익명), 내용은 편지 문서에만 있다.
       둘의 문서 id를 같게 맞춰 두어야 선생님 화면이 "내 편지가 트리 어디에 있는지"를
       찾을 수 있다. 그래서 id를 먼저 만들어 둔다. */
    // 미리보기에서는 쓰는 척만 한다(실제 컬렉션에 시험 편지를 남기지 않는다)
    if (DEMO) {
      $('#doneOrn').innerHTML = ornamentSVG(form.ornament, 148, 'xm-bigorn');
      $('#doneMsg').textContent = `${form.teacherName} 선생님께 마음이 전해졌어요.`;
      show(6);
      startDoneTimer();
      return;
    }
    const id = doc(collection(db, C_LETTERS)).id;
    const batch = writeBatch(db);
    batch.set(doc(db, C_LETTERS, id), {
      studentId:   form.sid,
      studentName: form.name,
      teacherId:   form.teacherId,
      teacherName: form.teacherName,
      body:        form.body,
      ornament:    form.ornament,
      hidden:      false,
      x:           form.x,
      y:           form.y,
      createdAt:   serverTimestamp(),
    });
    /* 트리 화면이 읽는 문서. 전시 화면에서 가까이 당겨 봤을 때 누가 달았는지
       보이도록 학번과 이름을 같이 적는다(2026-11-11).
       받는 선생님은 여기 넣지 말 것 — 넣는 순간 통신만 들여다봐도
       어느 오너먼트가 누구 앞으로 간 편지인지 드러난다. */
    batch.set(doc(db, C_ORNAMENTS, id), {
      ornament:    form.ornament,
      studentId:   form.sid,
      studentName: form.name,
      x:           form.x,
      y:           form.y,
      createdAt:   serverTimestamp(),
    });
    await batch.commit();

    $('#doneOrn').innerHTML = ornamentSVG(form.ornament, 148, 'xm-bigorn');
    $('#doneMsg').textContent = `${form.teacherName} 선생님께 마음이 전해졌어요.`;
    show(6);
    startDoneTimer();
  } catch (e) {
    console.error(e);
    $('#err5').textContent = '지금은 달 수 없어요. 잠시 뒤 다시 눌러 주세요.';
  } finally {
    sending = false;
    $('#go5go').textContent = '여기에 달기';
    $('#go5go').disabled = form.x == null;
  }
}

// ── 다 보낸 뒤 되돌아가기 ─────────────────────────────────────
let doneTimer = null;
function startDoneTimer() {
  let left = DONE_SEC;
  $('#tick').textContent = left;
  stopDoneTimer();
  doneTimer = setInterval(() => {
    left--;
    $('#tick').textContent = Math.max(0, left);
    if (left <= 0) resetAll();
  }, 1000);
}
function stopDoneTimer() {
  if (doneTimer) { clearInterval(doneTimer); doneTimer = null; }
}
$('#doneBack').addEventListener('click', () => resetAll());
$('#resetBtn').addEventListener('click', () => {
  if (step >= 3 && !confirm('쓰던 편지를 지우고 처음으로 돌아갈까요?')) return;
  resetAll();
});

// ── 자리를 비운 태블릿 ────────────────────────────────────────
let idleTimer = null, ackTimer = null;
function bumpIdle() {
  clearTimeout(idleTimer);
  closeIdleAsk();
  if (step === 1 || step === 5) return;   // 쓰던 내용이 없는 화면은 그냥 둔다
  idleTimer = setTimeout(askIdle, IDLE_MS);
}
function askIdle() {
  let left = IDLE_ACK;
  $('#idleTick').textContent = left;
  $('#idle').classList.add('on');
  clearInterval(ackTimer);
  ackTimer = setInterval(() => {
    left--;
    $('#idleTick').textContent = Math.max(0, left);
    if (left <= 0) { closeIdleAsk(); resetAll(); }
  }, 1000);
}
function closeIdleAsk() {
  clearInterval(ackTimer); ackTimer = null;
  $('#idle').classList.remove('on');
}
$('#idleKeep').addEventListener('click', bumpIdle);
['pointerdown', 'keydown', 'input'].forEach(ev =>
  document.addEventListener(ev, e => {
    if ($('#idle').classList.contains('on') && e.target.id !== 'idleKeep') return;
    bumpIdle();
  }, true));

// ── 시작 ──────────────────────────────────────────────────────
renderOrnaments();
show(1);
loadTeachers();
</script>
</body>
</html>
