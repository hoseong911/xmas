<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>감사편지 트리</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a1622'/><path d='M16 6.5 11 16h10z' fill='%232b7152'/><path d='M16 12 9 24h14z' fill='%231b4e3b'/><rect x='14.6' y='23' width='2.8' height='4' rx='1' fill='%235b4029'/><circle cx='16' cy='5' r='2.6' fill='%23f0c457'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="xmas.css">
  <style>
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden }

    /* ── 전시 화면은 트리에 자리를 다 내준다 ──────────────────────
       예전에는 제목과 아래 문구가 트리 위아래를 차지해 큰 TV에서도 트리가
       화면 한가운데 작게 떴다. 지금은 트리가 화면 높이를 꽉 채우고
       글자는 빈 밤하늘 위에 겹쳐 둔다.
       트리 칸은 여전히 폭 하나만 정한다 — aspect-ratio가 높이를 폭에서
       끌어내므로 둘 다 적으면 어긋나고, 그러면 오너먼트 좌표가 틀어진다. */
    .xm-treestage {
      position: fixed; inset: 0; z-index: 2;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    /* 카메라. 가까이 보기에서 이 칸을 통째로 확대하고 위아래로 훑는다. */
    .xm-cam {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transform-origin: 50% 0;
      will-change: transform;
    }
    .xm-treestage .xm-treewrap {
      width: min(100%, 100dvh * 100 / 130);
      margin: 0;
      container-type: inline-size;   /* 라벨 글자 크기를 트리 폭에 맞추려고 */
    }

    /* 글자는 트리 위에 겹친다. 가로로 넓은 화면(트리가 높이에 막히는 화면)에서는
       트리 양옆이 비므로 구석으로, 세로로 긴 화면에서는 트리 위아래가 비므로
       가운데로 둔다. 경계는 트리 비율(100/130) 그대로다. */
    .xm-treehead, .xm-treefoot {
      position: fixed; z-index: 4;
      text-shadow: 0 2px 10px rgba(5, 12, 22, .85);
      pointer-events: none;
    }
    .xm-treehead { top: 20px; left: 0; right: 0; text-align: center }
    .xm-treetitle { font-size: 26px; font-weight: 800; letter-spacing: -.6px; margin: 0 0 4px }
    .xm-treesub   { color: var(--hi-text-muted); font-size: 14px; margin: 0 }
    .xm-treefoot {
      bottom: 20px; left: 0; right: 0; text-align: center;
      color: var(--hi-text-muted); font-size: 15px; letter-spacing: -.2px;
    }
    .xm-treefoot b { color: var(--hi-accent); font-size: 21px; font-weight: 800 }

    @media (min-aspect-ratio: 100/130) {
      .xm-treehead  { top: 22px; left: 26px; right: auto; text-align: left }
      .xm-treefoot { bottom: 24px; left: 26px; right: auto; text-align: left }
    }

    /* 선생님 모드 알림 띠 */
    .xm-minebar {
      display: none;
      position: fixed; z-index: 5; left: 50%; top: 14px; transform: translateX(-50%);
      align-items: center; gap: 12px; flex-wrap: wrap;
      background: rgba(10, 22, 34, .82);
      border: 1px solid var(--hi-border-faint);
      border-radius: 999px; padding: 10px 18px;
      font-size: 14px; font-weight: 700; color: var(--hi-accent);
      max-width: max-content;
    }
    .xm-minebar.on { display: flex }

    /* 구석 단추 */
    .xm-corner {
      position: fixed; right: 16px; bottom: 16px; z-index: 6;
      display: flex; gap: 8px; align-items: center;
      opacity: .45; transition: opacity .2s ease;
    }
    .xm-corner:hover, .xm-corner:focus-within { opacity: 1 }

    @media (max-width: 600px) {
      .xm-corner { right: 10px; bottom: 10px }
      .xm-treetitle { font-size: 21px }
      .xm-treefoot { bottom: 58px }
    }

    /* 트리가 아직 비었을 때 */
    .xm-treeempty {
      position: absolute; left: 0; right: 0; top: 46%;
      text-align: center; font-size: 15px; color: var(--hi-text-muted);
      line-height: 1.8; pointer-events: none;
    }

    /* ── 가까이 보기 ──────────────────────────────────────────────
       카메라를 확대해 꼭대기부터 밑동까지 천천히 훑어 내렸다가 다시 올라온다.
       transform은 오른쪽부터 먹으므로 scale(Z) translateY(p)에서 실제로 움직인
       거리는 Z배가 된다. 어디서 시작해 어디서 멈출지(--pan0, --pan1)는 화면과
       트리의 실제 높이를 보고 스크립트가 px로 셈해 넣는다 — 화면 비율이 제각각이라
       한 가지 비율로 묶어 두면 세로로 긴 화면에서 트리를 지나쳐 허공을 훑는다.

       **움직임 줄이기(prefers-reduced-motion)로 이 애니메이션을 끄지 않는다.**
       가까이 보기는 사람이 일부러 고르는 보기이고, 훑어 내려가는 것이 그 보기의
       전부다. 끄면 화면이 확대된 채 멈춰 고장난 것처럼 보인다.
       (오너먼트 흔들림이나 별 반짝임 같은 곁다리는 그대로 끈다.) */
    .xm-cam.zoom {
      animation: xm-pan var(--pan-sec, 24s) ease-in-out infinite alternate;
    }
    @keyframes xm-pan {
      from { transform: scale(var(--zoom)) translateY(var(--pan0)) }
      to   { transform: scale(var(--zoom)) translateY(var(--pan1)) }
    }
    /* 학번과 이름. 평소에는 없고 가까이 보기에서만 뜬다.
       글자 크기를 cqw(트리 폭의 %)로 두어야 화면이 커져도 오너먼트와 같은
       비율을 지킨다. px로 두면 큰 TV에서 깨알같이 작아진다.

       한꺼번에 다 띄우면 160장이 서로 겹쳐 글자 덩어리가 된다. 그래서
       **카메라가 지금 보고 있는 띠에서만** 떠오르게 하고, 띠에서 멀어질수록
       사그라든다. 밝기(--lab)는 스크립트가 매 프레임 넣는다. */
    .xm-lab {
      display: none;
      position: absolute; left: 50%; top: 101%;
      transform: translateX(-50%);
      white-space: nowrap; text-align: center;
      font-size: 1.15cqw; line-height: 1.25; font-weight: 700;
      color: #fff;
      opacity: calc(var(--lab, 0) * .82);
      text-shadow: 0 1px 4px rgba(0, 0, 0, .95), 0 0 10px rgba(0, 0, 0, .7);
      pointer-events: none;
    }
    .xm-lab i { display: block; font-style: normal; opacity: .82; font-weight: 600 }
    .xm-orns.labels .xm-lab { display: block }


  </style>
</head>
<body class="hi-preset-xmas xm-body">
  <div class="xm-sky"></div>
  <div class="xm-stars"></div>
  <canvas class="xm-snow" id="snow"></canvas>

  <main class="xm-treestage">
    <div class="xm-cam" id="cam">
      <div class="xm-treewrap" id="wrap">
        <!-- 가지와 별은 tree-layout.js의 TIERS에서 그린다(자리 계산과 같은 파일이라 어긋나지 않는다) -->
        <svg viewBox="0 0 100 130" preserveAspectRatio="xMidYMid meet" aria-label="크리스마스트리">
          <!-- 바닥에 쌓인 눈. 가로로 꽉 찬 띠를 쓰면 트리 칸 가장자리에서 네모로 뚝 잘려
               바닥이 아니라 상자처럼 보인다. 양끝이 자연히 사라지는 타원으로 둔다. -->
          <ellipse cx="50" cy="128" rx="46" ry="7.5" fill="#dceaf7" opacity=".10"/>
          <ellipse cx="50" cy="125" rx="30" ry="5" fill="#dceaf7" opacity=".07"/>
          <!-- 기둥 -->
          <rect x="45.5" y="112" width="9" height="13" rx="3" fill="#6b4a2e"/>
          <rect x="45.5" y="112" width="3.2" height="13" rx="1.6" fill="#80593a"/>
          <g id="treeArt"></g>
        </svg>
        <div class="xm-orns" id="orns"></div>
        <div class="xm-treeempty" id="treeEmpty" hidden>아직 달린 편지가 없어요.<br>첫 번째 마음을 달아 주세요.</div>
      </div>
    </div>
  </main>

  <header class="xm-treehead">
    <h1 class="xm-treetitle" id="title">감사편지 트리</h1>
    <p class="xm-treesub" id="sub">마음을 적어 트리에 달아 주세요</p>
  </header>

  <div class="xm-treefoot" id="foot"></div>

  <div class="xm-minebar" id="minebar">
    <span id="mineLabel"></span>
    <button class="xm-btn xm-btn-ghost xm-btn-sm" id="mineOff" type="button">트리 전체 보기</button>
  </div>

  <div class="xm-corner">
    <button class="xm-btn xm-btn-ghost xm-btn-sm" id="viewBtn" type="button">가까이 보기</button>
    <a class="xm-btn xm-btn-ghost xm-btn-sm" href="teacher.html">선생님 전용</a>
  </div>

<script type="module">
import { collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, C_ORNAMENTS, watchConfig, esc, mountSnow } from "./xmas-core.js";
import { ornamentSVG } from "./ornaments.js";
import { placeAll, TREE, TIERS, tierPath, starPath } from "./tree-layout.js";
import { demoCount, demoOrnaments, mountDemoBadge } from "./demo-data.js";

const $ = s => document.querySelector(s);

mountSnow($('#snow'), 90);

/* ── 트리 그리기 ───────────────────────────────────────────────
   가지는 아래 단부터 그린다. 그래야 위 단의 물결진 밑자락이 아래 단을 덮으며
   층이 겹쳐 보인다(거꾸로 그리면 위 단이 가려져 밋밋한 삼각형이 된다).
   단마다 같은 모양을 조금 아래로 민 짙은 사본을 먼저 깔아 그림자를 만든다. */
(function drawTree() {
  const art = $('#treeArt');
  const ns = 'http://www.w3.org/2000/svg';
  const add = (tag, attrs) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    art.appendChild(el);
    return el;
  };

  for (let i = TIERS.length - 1; i >= 0; i--) {
    const t = TIERS[i];
    add('path', { d: tierPath(t, 2.2), fill: t.shade });          // 아래 단에 지는 그림자
    add('path', { d: tierPath(t), fill: t.fill });                // 가지
    // 물결진 밑자락에 걸린 눈
    add('path', {
      d: tierPath(t, -1.1), fill: 'none',
      stroke: '#eafaff', 'stroke-width': 0.9, 'stroke-opacity': 0.22,
      'stroke-linejoin': 'round',
    });
  }

  // 가지에 걸린 작은 전구. 단마다 지그재그로 흩어 둔다.
  const bulbs = [
    [41, 36], [57, 39],
    [33, 60], [49, 65], [64, 61],
    [27, 86], [43, 91], [59, 89], [73, 84],
    [22, 110], [38, 114], [55, 113], [70, 110], [78, 105],
  ];
  const bulbColors = ['#ffd978', '#ffe9b0', '#ffc9a0'];
  bulbs.forEach(([x, y], i) => {
    add('circle', { cx: x, cy: y, r: 1.15, fill: bulbColors[i % 3], 'fill-opacity': 0.75 });
  });

  /* 꼭대기 별.
     바깥에 옅은 별을 한 겹 더 까는 방식은 버렸다 — 어두운 밤하늘 위에서
     낮은 불투명도의 금색이 회색 테두리처럼 보여 빛이 아니라 그림자가 됐다.
     지금은 가운데가 밝고 가장자리로 사라지는 둥근 빛을 뒤에 깐다.
     (오너먼트와 달리 트리는 화면에 하나뿐이라 그라데이션 id를 써도 안 엉킨다.)
     빛이 viewBox 위로 삐져나가면 거기서 뚝 잘려 네모 자국이 생긴다.
     그래서 별을 조금 내리고 빛 반지름을 위쪽 여백 안에 맞췄다(cy - r >= 0). */
  const STAR_Y = 11, GLOW_R = 11;
  const defs = document.createElementNS(ns, 'defs');
  const grad = document.createElementNS(ns, 'radialGradient');
  grad.setAttribute('id', 'xmStarGlow');
  [['0%', '#ffe9a8', '.6'], ['45%', '#f0c457', '.24'], ['100%', '#f0c457', '0']]
    .forEach(([off, col, op]) => {
      const s = document.createElementNS(ns, 'stop');
      s.setAttribute('offset', off);
      s.setAttribute('stop-color', col);
      s.setAttribute('stop-opacity', op);
      grad.appendChild(s);
    });
  defs.appendChild(grad);
  art.appendChild(defs);
  add('circle', { cx: 50, cy: STAR_Y, r: GLOW_R, fill: 'url(#xmStarGlow)' });
  add('path', { d: starPath(50, STAR_Y, 8.4, 3.5), fill: '#f7d479' });
  add('path', { d: starPath(50, STAR_Y - 0.5, 4.2, 1.8), fill: '#fff6d8', 'fill-opacity': 0.9 });
})();

watchConfig(c => {
  $('#title').textContent = c.title;
  $('#sub').textContent = c.sub;
  document.title = c.title;
});

/* ── 보기 두 가지 ──────────────────────────────────────────────
   전체 보기   트리 하나가 화면을 꽉 채운다. 멀리서 보는 전시용.
   가까이 보기 카메라가 확대해 꼭대기부터 밑동까지 천천히 훑어 내렸다가
              다시 올라온다. 이때만 오너먼트 밑에 학번과 이름이 뜬다.

   주소에 ?view=zoom 을 붙이면 처음부터 가까이 보기로 열린다(TV에 그대로 띄우는 용).
   구석 단추로도 오갈 수 있고, 고른 보기는 주소에 남아 새로고침해도 유지된다. */
const ZOOM    = 2.0;    // 적어도 이만큼은 당긴다
const ZOOM_MAX = 3.2;   // 세로로 긴 화면에서도 이보다 더 당기지는 않는다
const FILL    = 1.6;    // 당긴 트리가 화면 높이의 이 정도는 되어야 훑을 맛이 난다
const PAN_SEC = 24;     // 꼭대기에서 밑동까지 한 번 훑는 데 걸리는 초
const BAND    = 9;      // 이름이 뜨는 띠의 두께(트리 좌표, 위아래로 이만큼)
const LAB_DX  = 7;      // 이름끼리 이만큼 안 떨어지면 뒤엣것을 숨긴다(가로)
const LAB_DY  = 3.4;    //                                        (세로)
const cam = $('#cam');

/* 배율과 훑을 구간을 화면에 맞춰 셈한다.
   offsetHeight는 transform이 먹기 **전**의 높이다(getBoundingClientRect는 먹은 뒤라
   여기 쓰면 당길 때마다 값이 불어나 제멋대로가 된다).

   트리는 카메라 칸 한가운데 있다. 당기는 기준점이 칸의 위 가운데(transform-origin)이므로
   꼭대기를 화면 위에 맞추려면 위쪽 여백만큼 끌어올려야 하고, 밑동을 화면 바닥에 맞추려면
   거기서 (트리 높이 빼기 화면 높이 나누기 배율)만큼 더 올라가야 한다. */
function fitCamera() {
  const camH  = cam.clientHeight;
  const wrapH = $('#wrap').offsetHeight;
  if (!camH || !wrapH) return;
  // 세로로 긴 화면에서는 트리가 폭에 막혀 짧아진다. 그만큼 더 당겨야 훑을 구간이 생긴다.
  const z   = Math.min(ZOOM_MAX, Math.max(ZOOM, (camH * FILL) / wrapH));
  const gap = (camH - wrapH) / 2;          // 트리 위에 남는 여백
  const p0  = -gap;                        // 꼭대기가 화면 위에 닿는 자리
  const p1  = Math.min(p0, camH / z - gap - wrapH);   // 밑동이 화면 바닥에 닿는 자리
  cam.style.setProperty('--zoom', z.toFixed(3));
  cam.style.setProperty('--pan0', p0.toFixed(1) + 'px');
  cam.style.setProperty('--pan1', p1.toFixed(1) + 'px');
  cam.style.setProperty('--pan-sec', PAN_SEC + 's');
}

function setView(mode) {
  const zoom = mode === 'zoom';
  cam.classList.toggle('zoom', zoom);
  $('#orns').classList.toggle('labels', zoom);
  $('#viewBtn').textContent = zoom ? '전체 보기' : '가까이 보기';
  if (zoom) {
    fitCamera();
  } else {
    cam.style.removeProperty('--zoom');
    cam.style.removeProperty('--pan0');
    cam.style.removeProperty('--pan1');
  }
  if (zoom) startFocus(); else stopFocus();
  const u = new URL(location.href);
  if (zoom) u.searchParams.set('view', 'zoom'); else u.searchParams.delete('view');
  history.replaceState(null, '', u);
}

/* ── 카메라가 보고 있는 띠 ─────────────────────────────────────
   애니메이션이 지금 어디쯤인지를 시간으로 되짚지 않고 **실제로 그려진 자리**에서
   읽는다(getBoundingClientRect는 transform이 먹은 뒤의 값이다). 가속 곡선이나
   브라우저 차이와 무관하게 늘 맞고, 사람이 보기 모드를 바꿔도 저절로 따라온다. */
let camRaf = 0;
let tickSkip = 0;

function updateFocus() {
  const r = $('#wrap').getBoundingClientRect();
  if (!r.height) return;
  const focusY = ((window.innerHeight / 2 - r.top) / r.height) * TREE.vbH;

  // 1) 띠 안에 드는 것을 모은다. 띠 한가운데가 1, 가장자리가 0.
  const lit = [];
  const off = [];
  for (const el of nodes.values()) {
    const y = +el.dataset.y || 0;
    const d = Math.abs(y - focusY);
    if (d >= BAND) { off.push(el); continue; }
    lit.push({ el, x: +el.dataset.x || 50, y, v: Math.round((1 - d / BAND) * 100) / 100 });
  }

  /* 2) 띠 안이라도 바짝 붙은 것끼리는 글자가 겹쳐 읽을 수 없다.
        띠 한가운데에 가까운 것부터 자리를 잡고, 이미 잡힌 이름과 너무 가까우면
        그 이름은 이번에는 쉰다(오너먼트 그림은 그대로 있다). */
  const kept = [];
  lit.sort((a, b) => b.v - a.v);
  for (const c of lit) {
    const clash = kept.some(k => Math.abs(k.x - c.x) < LAB_DX && Math.abs(k.y - c.y) < LAB_DY);
    if (clash) { off.push(c.el); continue; }
    kept.push(c);
    set(c.el, c.v);
  }
  for (const el of off) set(el, 0);
}

/** 바뀐 것만 건드린다 — 매 프레임 160장에 스타일을 쓰면 괜히 버겁다 */
function set(el, v) {
  if (el.dataset.lit === String(v)) return;
  el.dataset.lit = String(v);
  el.style.setProperty('--lab', v);
}

function startFocus() {
  if (camRaf) return;
  const tick = () => {
    camRaf = requestAnimationFrame(tick);
    // 160장을 매 프레임 훑을 일은 없다. 세 프레임에 한 번이면 눈에 똑같다.
    if (tickSkip++ % 3 === 0) updateFocus();
  };
  camRaf = requestAnimationFrame(tick);
}

function stopFocus() {
  if (camRaf) cancelAnimationFrame(camRaf);
  camRaf = 0;
  for (const el of nodes.values()) {
    el.dataset.lit = '';
    el.style.removeProperty('--lab');
  }
}

$('#viewBtn').addEventListener('click', () => {
  setView(cam.classList.contains('zoom') ? 'full' : 'zoom');
});

// 화면이 바뀌면(TV 해상도 전환, 폰 돌리기) 훑을 구간을 다시 잡는다
window.addEventListener('resize', () => { if (cam.classList.contains('zoom')) fitCamera(); });

/* ── 선생님 모드 ───────────────────────────────────────────────
   teacher.html에서 네 자리 번호를 확인한 뒤 같은 탭으로 넘어오면
   sessionStorage에 자기 편지 id 목록이 들어 있다. 트리는 그것만 빛나게 한다.
   학생이 보는 보통의 트리에는 이 정보가 전혀 없다(그냥 오너먼트뿐). */
let mineIds = null;
try {
  const raw = sessionStorage.getItem('xmas_mine');
  if (raw) {
    const m = JSON.parse(raw);
    if (m && Array.isArray(m.ids)) {
      mineIds = new Set(m.ids);
      $('#minebar').classList.add('on');
      $('#mineLabel').textContent = `${m.name || ''} 선생님께 온 편지 ${m.ids.length}통이 빛나고 있어요`;
      $('#orns').classList.add('mine');
    }
  }
} catch { mineIds = null; }

$('#mineOff').addEventListener('click', () => {
  sessionStorage.removeItem('xmas_mine');
  mineIds = null;
  $('#minebar').classList.remove('on');
  $('#orns').classList.remove('mine');
  render();
});

// ── 오너먼트 걸기 ─────────────────────────────────────────────
let items = [];                 // [{id, ornament, x, y, studentId, studentName}] 걸린 순서
const nodes = new Map();        // id → 화면 요소
let firstPaint = true;

/** 가까이 봤을 때 오너먼트 밑에 뜨는 두 줄. 학번과 이름이 없는 문서는 그냥 비운다. */
function labelHTML(it) {
  if (!it.studentId && !it.studentName) return '';
  return `<span class="xm-lab">${esc(it.studentId || '')}<i>${esc(it.studentName || '')}</i></span>`;
}

function render(freshIds = new Set()) {
  const wrap = $('#orns');
  // 학생이 고른 자리(x, y)가 있으면 그대로, 없는 옛 문서만 자동으로 채운다
  const placed = placeAll(items);
  const byId = new Map(items.map(it => [it.id, it]));

  // 사라진 것 치우기(어드민에서 숨긴 편지)
  for (const [id, el] of nodes) {
    if (!byId.has(id)) { el.remove(); nodes.delete(id); }
  }

  for (const p of placed) {
    let el = nodes.get(p.id);
    if (!el) {
      const it = byId.get(p.id);
      el = document.createElement('div');
      el.className = 'xm-hang';
      el.innerHTML = `<span class="xm-sway">${ornamentSVG(it.ornament, 64)}</span>${labelHTML(it)}`;
      // 같은 모양이라도 흔들리는 박자를 다르게 해야 한 몸처럼 움직이지 않는다
      el.querySelector('.xm-sway').style.animationDelay = `-${(Math.random() * 5).toFixed(2)}s`;
      if (!firstPaint && freshIds.has(p.id)) {
        el.classList.add('fresh');
        setTimeout(() => el.classList.remove('fresh'), 1400);
      }
      wrap.appendChild(el);
      nodes.set(p.id, el);
    }
    el.classList.toggle('mine', !!(mineIds && mineIds.has(p.id)));
    // 띠 안에 드는지, 이웃 이름과 겹치지 않는지 보려고 트리 좌표를 적어 둔다
    el.dataset.x = p.x;
    el.dataset.y = p.y;
    el.style.left  = p.x + '%';
    el.style.top   = (p.y / TREE.vbH * 100) + '%';
    el.style.width = p.w + '%';
  }

  $('#treeEmpty').hidden = items.length > 0;
  $('#foot').innerHTML = items.length
    ? `지금까지 <b>${items.length}</b>통의 마음이 모였어요`
    : '';
  firstPaint = false;
}

/* 처음 보기를 정한다. nodes와 render가 다 만들어진 뒤라야 한다 —
   setView가 띠 따라가기를 켜고 끄면서 nodes를 건드린다. */
setView(new URLSearchParams(location.search).get('view') === 'zoom' ? 'zoom' : 'full');

/* 미리보기: ?demo=160 이면 Firebase를 보지 않고 가짜 트리를 그린다.
   축제 당일처럼 꽉 찬 트리를 실제 컬렉션을 더럽히지 않고 보려고 둔 길이다. */
const DEMO = demoCount();
if (DEMO) {
  mountDemoBadge(DEMO);
  items = demoOrnaments(DEMO);
  render();
} else {

/* 오너먼트 문서에는 모양과 자리, 그리고 쓴 사람의 학번과 이름만 있다.
   받는 선생님은 들어 있지 않다 — 그래서 트리를 들여다봐도 누가 누구에게
   썼는지는 알 수 없다(그 둘을 잇는 것은 관리자만 읽는 편지 문서뿐이다). */
onSnapshot(query(collection(db, C_ORNAMENTS), orderBy('createdAt')),
  snap => {
    const fresh = new Set();
    snap.docChanges().forEach(ch => { if (ch.type === 'added') fresh.add(ch.doc.id); });
    items = snap.docs.map(d => {
      const v = d.data();
      return {
        id: d.id, ornament: v.ornament, x: v.x, y: v.y,
        studentId: v.studentId, studentName: v.studentName,
      };
    });
    render(fresh);
  },
  err => {
    console.error(err);
    $('#foot').textContent = '트리를 불러오지 못했어요. 새로고침해 주세요.';
  });
}
</script>
